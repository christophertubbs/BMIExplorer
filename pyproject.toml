[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bmi-explorer"
version = "0.1.0"
description = "Interactive, strict-buffer CSDMS BMI teaching fixtures"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "bmipy==2.0.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
bmi-explorer = "bmi_explorer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bmi_explorer = ["py.typed", "config/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
